[package]
name = "homerpg-archlord-launcher"
version = "0.2.0"
edition = "2024"
license-file = "../LICENCE.txt"
description = "HomeRPG ArchLord — launcher du serveur local ArchCore (ArchLord en solo) / local ArchCore server launcher (single-player ArchLord)"

[dependencies]
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust"] }
rand = "0.10.3"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Globalization"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
